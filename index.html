<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0e14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Gym Log</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />

<style>
  :root {
    --bg: #0b0e14;
    --surface: #141923;
    --surface-2: #1c2331;
    --border: #283244;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.14);
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.16);
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.16);
    --purple: #a78bfa;
    --purple-dim: rgba(167, 139, 250, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .app-shell {
    max-width: 540px;
    margin: 0 auto;
    padding: 0 14px 180px 14px;
  }
  .top-bar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(11, 14, 20, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px 10px 14px;
    margin: 0 -14px 12px -14px;
  }
  .brand-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.2px; }
  .sync-pill {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
    cursor: pointer;
  }
  .sync-pill.live { color: var(--green); border-color: rgba(34,197,94,0.4); background: var(--green-dim); }
  .sync-pill.syncing { color: var(--amber); border-color: rgba(245,158,11,0.4); }
  .sync-pill.dirty { color: var(--accent); border-color: rgba(56,189,248,0.45); background: var(--accent-dim); }

  /* Day Navigator */
  .day-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 8px;
  }
  .nav-arrow {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }
  .nav-center { text-align: center; flex: 1; padding: 0 8px; }
  .nav-date { font-size: 15px; font-weight: 700; }
  .nav-meta { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
    padding: 2px 7px; border-radius: 6px; text-transform: uppercase;
  }
  .badge-next { background: var(--accent-dim); color: var(--accent); }
  .badge-done { background: var(--green-dim); color: var(--green); }
  .badge-missed { background: var(--amber-dim); color: var(--amber); }
  .badge-upcoming { background: var(--surface-2); color: var(--muted); }

  .jump-btn {
    width: 100%; margin-top: 8px; padding: 7px;
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid rgba(56,189,248,0.35); border-radius: 10px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }

  /* Session Progress Bar */
  .prog-wrap { margin-top: 9px; }
  .prog-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px;
  }
  .prog-track {
    width: 100%; height: 6px; background: var(--surface-2);
    border-radius: 999px; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 999px; transition: width 0.25s ease;
  }

  /* Section Jump Pills */
  .pill-strip {
    display: flex; gap: 6px; padding: 8px 0 2px 0;
  }
  .sec-pill {
    flex: 1; text-align: center;
    white-space: nowrap; font-size: 11px; font-weight: 700;
    padding: 6px 8px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
  }
  .sec-pill.done {
    border-color: rgba(34,197,94,0.45);
    background: var(--green-dim);
    color: var(--green);
  }

  /* Section Dividers */
  .sec-header {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 2px 8px 2px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.9px;
    text-transform: uppercase; color: var(--muted);
    scroll-margin-top: 175px;
  }
  .sec-header::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }
  .sec-header:first-child { margin-top: 4px; }

  /* Exercise Cards */
  .ex-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px; margin-bottom: 12px;
  }
  .ex-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 8px;
  }
  .ex-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ex-name { font-size: 16px; font-weight: 800; }
  .ex-swap-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 5px 10px;
    color: var(--text); font-size: 14px; font-weight: 800;
    cursor: pointer;
  }
  .ex-swap-btn.modified-move {
    border-color: rgba(34, 197, 94, 0.65);
  }
  .cat-tag {
    font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .cat-main { background: var(--accent-dim); color: var(--accent); }
  .cat-acc { background: var(--purple-dim); color: var(--purple); }
  .cat-cardio { background: var(--green-dim); color: var(--green); }
  .ex-sub { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  .set-row {
    display: grid;
    grid-template-columns: 30px 1fr 1fr 48px;
    align-items: center; gap: 8px;
    padding: 8px 0;
    border-top: 1px solid rgba(40, 50, 68, 0.6);
  }
  .set-row.cardio-row {
    grid-template-columns: 1fr 1fr 48px;
  }
  .set-row.circuit-row {
    grid-template-columns: minmax(96px, 1.15fr) 1.15fr 48px;
  }
  .set-row:first-of-type { border-top: none; }
  .set-num { font-size: 12px; font-weight: 700; color: var(--muted); }
  .move-tag-btn {
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 9px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
  }
  .move-tag-btn.modified-move {
    border-color: rgba(167, 139, 250, 0.65);
  }
  .move-tag-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 1px;
  }
  .move-tag-name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px;
  }
  .stepper.modified-weight {
    border-color: rgba(245, 158, 11, 0.6);
  }
  .step-btn {
    width: 28px; height: 28px; border-radius: 7px; border: none;
    background: var(--bg); color: var(--text); font-weight: 800; font-size: 15px;
    cursor: pointer;
  }
  .step-val { text-align: center; }
  .step-main { font-size: 14px; font-weight: 800; display: block; }
  .step-hint { font-size: 10px; color: var(--muted); display: block; }
  .fx-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.55;
    vertical-align: middle;
    margin-left: 4px;
    margin-bottom: 2px;
  }

  .plate-45 { color: #fb923c; font-weight: 800; } /* Orange */
  .plate-35 { color: #38bdf8; font-weight: 800; } /* Blue */
  .plate-25 { color: #facc15; font-weight: 800; } /* Yellow */
  .plate-10 { color: #4ade80; font-weight: 800; } /* Green */
  .plate-1-25 { color: #facc15; font-weight: 800; } /* Yellow Micro */
  .plate-std { color: var(--muted); font-weight: 700; } /* 5 & 2.5 lb */

  .check-btn {
    width: 46px; height: 42px; border-radius: 11px;
    border: 2px solid #475569;
    background: #0f172a;
    color: #94a3b8;
    font-size: 18px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .check-btn.checked {
    background: var(--green);
    border-color: #4ade80;
    color: #052e16;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
  }

  /* Native PWA Exercise Picker Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(5, 8, 14, 0.78);
    backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 540px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 16px 16px 26px 16px;
    max-height: 82vh;
    overflow-y: auto;
    animation: sheetUp 0.18s ease-out;
  }
  @keyframes sheetUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .modal-title { font-size: 15px; font-weight: 800; color: var(--text); }
  .modal-close {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 5px 10px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .option-list {
    display: flex; flex-direction: column; gap: 7px;
    margin-bottom: 14px;
  }
  .option-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 11px; padding: 11px 13px;
    color: var(--text); font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: left;
  }
  .option-item.selected {
    border-color: var(--purple);
    background: var(--purple-dim);
    color: #ede9fe;
  }
  .option-item.selected-cardio {
    border-color: var(--green);
    background: var(--green-dim);
    color: #dcfce7;
  }
  .custom-move-row {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .custom-move-input {
    flex: 1;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    color: var(--text); font-size: 13px; font-weight: 600;
    outline: none;
  }
  .custom-move-input:focus { border-color: var(--purple); }
  .custom-move-apply {
    background: var(--purple); color: #1e1035;
    border: none; border-radius: 10px; padding: 0 14px;
    font-size: 13px; font-weight: 800; cursor: pointer;
  }

  /* Contextual Save FAB */
  .save-fab {
    position: fixed;
    right: 16px;
    bottom: 74px;
    z-index: 45;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.2);
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #041d2e;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.2px;
    box-shadow: 0 10px 26px rgba(2, 132, 199, 0.45);
    cursor: pointer;
    transform: translateY(120px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease, bottom 0.2s ease;
  }
  .save-fab.visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .save-fab.above-timer {
    bottom: 138px;
  }
  .save-fab:disabled {
    opacity: 0.7;
    cursor: default;
  }

  /* Floating Rest Timer */
  .rest-bar {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 512px;
    background: #182030; border: 1px solid var(--accent);
    border-radius: 14px; padding: 10px 14px;
    display: none; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 28px rgba(0,0,0,0.65); z-index: 40;
  }
  .rest-bar.active { display: flex; }
  .rest-time { font-size: 20px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rest-controls { display: flex; gap: 6px; }
  .rest-btn {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 700;
    cursor: pointer;
  }

  /* Bottom Navigation Tabs */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(11, 14, 20, 0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: center;
    padding: 8px 14px 12px 14px; z-index: 35;
  }
  .bottom-inner {
    width: 100%; max-width: 512px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .tab-btn {
    background: transparent; border: 1px solid transparent;
    border-radius: 11px; padding: 8px 4px;
    color: var(--muted); font-size: 12px; font-weight: 700;
    cursor: pointer; text-align: center;
  }
  .tab-btn.active {
    background: var(--accent-dim);
    border-color: rgba(56, 189, 248, 0.35);
    color: var(--accent);
  }

  /* Progress & Insights View */
  .ai-card {
    background: linear-gradient(160deg, #161e2e 0%, #131824 100%);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .ai-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 8px;
  }
  .ai-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 800; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .ai-bullet-list {
    margin: 0; padding-left: 16px;
    display: flex; flex-direction: column; gap: 7px;
    font-size: 13px; line-height: 1.42; color: var(--text);
  }
  .ai-bullet-list li::marker { color: var(--accent); }
  .ai-footer {
    margin-top: 9px; font-size: 10px; font-weight: 700;
    color: var(--muted); display: flex; justify-content: space-between;
  }

  .kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .kpi-val { font-size: 17px; font-weight: 900; color: var(--text); }
  .kpi-lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .stat-box.expanded {
    grid-column: 1 / -1;
    border-color: rgba(56, 189, 248, 0.55);
    background: #161d2b;
  }
  .stat-box.expanded.acc-box {
    border-color: rgba(167, 139, 250, 0.55);
  }
  .stat-box.expanded.cardio-box {
    border-color: rgba(34, 197, 94, 0.55);
  }
  .stat-top-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;
  }
  .stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .expand-hint {
    font-size: 10px; font-weight: 800; color: var(--muted);
    background: var(--surface-2); padding: 2px 6px; border-radius: 5px;
  }
  .stat-num { font-size: 20px; font-weight: 900; margin-top: 4px; color: var(--accent); }
  .mini-spark-wrap { margin-top: 8px; height: 34px; }
  .expanded-detail { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .history-pills {
    display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; margin-top: 8px;
    border-top: 1px dashed rgba(40, 50, 68, 0.8);
    scrollbar-width: none;
  }
  .history-pills::-webkit-scrollbar { display: none; }
  .hist-pill {
    white-space: nowrap; font-size: 10px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 7px; color: var(--muted);
  }

  /* Circuit Horizontal Bar Breakdown */
  .circuit-bar-list {
    display: flex; flex-direction: column; gap: 9px; margin-bottom: 6px;
  }
  .cbar-row {
    display: flex; flex-direction: column; gap: 3px;
  }
  .cbar-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px;
  }
  .cbar-name { font-weight: 800; color: var(--text); }
  .cbar-meta { font-weight: 700; color: var(--muted); font-size: 10px; }
  .cbar-track {
    width: 100%; height: 7px; border-radius: 999px;
    background: var(--surface-2); overflow: hidden;
  }
  .cbar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), #c4b5fd);
  }

  /* Calendar View */
  .cal-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px 10px; margin-bottom: 10px;
  }
  .cal-month-title { font-size: 16px; font-weight: 800; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 10px;
  }
  .cal-dow {
    text-align: center; font-size: 10px; font-weight: 800;
    color: var(--muted); padding-bottom: 4px; text-transform: uppercase;
  }
  .cal-cell {
    aspect-ratio: 1 / 1.08;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--surface-2);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--muted);
    position: relative;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .cal-cell.empty { background: transparent; }
  .cal-cell.has-workout { cursor: pointer; color: var(--text); border-color: var(--border); }
  .cal-cell.status-done { background: var(--green-dim); border-color: rgba(34,197,94,0.45); color: var(--green); }
  .cal-cell.status-next { background: var(--accent-dim); border-color: rgba(56,189,248,0.55); color: var(--accent); }
  .cal-cell.status-missed { background: var(--amber-dim); border-color: rgba(245,158,11,0.45); color: var(--amber); }
  .cal-cell.status-upcoming { background: var(--surface-2); border-color: var(--border); color: var(--text); }
  .cal-cell.selected-day {
    outline: 2px solid #f8fafc;
    outline-offset: -2px;
    transform: scale(1.04);
  }
  .cal-dot {
    font-size: 9px; font-weight: 800; margin-top: 2px; letter-spacing: 0.2px;
  }
  .legend-row {
    display: flex; justify-content: space-around; flex-wrap: wrap; gap: 8px;
    margin-top: 10px; font-size: 11px; color: var(--muted); font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  /* Calendar Selected Workout Preview Card */
  .cal-preview-card {
    margin-top: 14px;
    background: var(--surface);
    border: 1px solid rgba(56, 189, 248, 0.45);
    border-radius: 16px;
    padding: 14px;
    animation: slideFadeIn 0.18s ease-out;
  }
  @keyframes slideFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .preview-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .preview-ex-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(40, 50, 68, 0.5);
    gap: 10px;
  }
  .preview-ex-row:last-of-type { border-bottom: none; }
  .preview-ex-left { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .preview-ex-name { font-size: 13px; font-weight: 800; color: var(--text); }
  .preview-ex-right {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-align: right; white-space: nowrap;
  }
  .preview-actions {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .preview-open-btn {
    flex: 1; padding: 9px 12px;
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid rgba(56,189,248,0.4); border-radius: 10px;
    font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .preview-close-btn {
    padding: 9px 14px;
    background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- WORKOUT VIEW -->
  <div id="view-workout">
    <div class="top-bar">
      <div class="brand-row">
        <div class="brand-title">Gym Log</div>
        <button id="syncPill" class="sync-pill" onclick="refreshFromSheet(false, true)">Connecting...</button>
      </div>
      <div class="day-nav">
        <button id="prevBtn" class="nav-arrow" onclick="stepDay(-1)">&#8249;</button>
        <div class="nav-center">
          <div id="navDate" class="nav-date">Loading schedule...</div>
          <div id="navMeta" class="nav-meta"></div>
        </div>
        <button id="nextBtn" class="nav-arrow" onclick="stepDay(1)">&#8250;</button>
      </div>
      <button id="jumpNextBtn" class="jump-btn" style="display:none;" onclick="jumpToTarget()">Jump to Next Up &#8594;</button>
      <div id="progWrap" class="prog-wrap" style="display:none;">
        <div class="prog-labels">
          <span id="progText">0 / 0 Sets Done</span>
          <span id="progPct">0%</span>
        </div>
        <div class="prog-track"><div id="progFill" class="prog-fill" style="width:0%"></div></div>
      </div>
      <div id="pillStrip" class="pill-strip"></div>
    </div>
    <div id="workoutContainer"></div>
  </div>

  <!-- PROGRESS & INSIGHTS VIEW -->
  <div id="view-progress" style="display:none; padding-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:18px;font-weight:800;">Progress &amp; Insights</div>
      <button class="sync-pill live" onclick="refreshFromSheet(false, true)">Refresh Data</button>
    </div>
    <div id="progressContainer"></div>
  </div>

  <!-- CALENDAR / SCHEDULE VIEW -->
  <div id="view-calendar" style="display:none; padding-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:18px;font-weight:800;">Workout Schedule</div>
      <button class="sync-pill live" onclick="refreshFromSheet(false, true)">Sync Sheet</button>
    </div>
    <div id="calendarContainer"></div>
  </div>
</div>

<!-- EXERCISE PICKER MODAL (CIRCUIT & CARDIO) -->
<div id="movePickerModal" class="modal-backdrop" onclick="closeMovePicker(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div id="movePickerTitle" class="modal-title">Select Exercise</div>
      <button class="modal-close" onclick="closeMovePicker()">Cancel</button>
    </div>
    <div id="movePickerOptions" class="option-list"></div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;">Or Enter Custom Exercise</div>
    <div class="custom-move-row">
      <input id="customMoveInput" class="custom-move-input" type="text" placeholder="Type exercise name..." />
      <button class="custom-move-apply" onclick="applyCustomMove()">Set</button>
    </div>
  </div>
</div>

<!-- CONTEXTUAL SAVE FAB -->
<button id="saveFab" class="save-fab" onclick="saveCurrentSession()">
  <span>&#10003;</span>
  <span id="saveFabLabel">Save Changes</span>
</button>

<!-- FLOATING REST TIMER -->
<div id="restBar" class="rest-bar">
  <div>
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;">Rest Timer</div>
    <div id="restClock" class="rest-time">02:30</div>
  </div>
  <div class="rest-controls">
    <button class="rest-btn" onclick="startRest(90)">1:30</button>
    <button class="rest-btn" onclick="startRest(150)">2:30</button>
    <button class="rest-btn" onclick="adjustRest(30)">+30s</button>
    <button class="rest-btn" onclick="stopRest()">&#10005;</button>
  </div>
</div>

<!-- BOTTOM NAVIGATION TABS -->
<div class="bottom-nav">
  <div class="bottom-inner">
    <button id="tab-workout" class="tab-btn active" onclick="switchTab('workout')">Workout</button>
    <button id="tab-progress" class="tab-btn" onclick="switchTab('progress')">Insights</button>
    <button id="tab-calendar" class="tab-btn" onclick="switchTab('calendar')">Schedule</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkhC54IxDTNkaspBOUuhvuQ0nEBMlWj5rcm66Aza-12UyCq9LJbYeGTGWqwTJlMsjb7A/exec";

  let sessions = [];
  let circuitOptions = [];
  let cardioOptions = [];
  let isOffline = false;
  let aiInsights = null;
  let refreshingInsights = false;
  let currentIdx = 0;
  let targetIdx = 0;
  let userNavigated = false;
  let activeTab = 'workout';
  let expandedCardName = null;
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let selectedCalendarIdx = null;
  let savedSnapshot = '';
  let restSeconds = 0;
  let restInterval = null;
  let pickerTarget = null; // { exIdx, setIdx, mode: 'circuit' | 'cardio' }

  function hasValue(v) {
    return v !== '' && v !== null && v !== undefined && !isNaN(Number(v));
  }

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function getMondayWeekKey(isoDate) {
    const [y, m, d] = isoDate.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const dow = dt.getDay();
    const diff = (dow === 0 ? -6 : 1 - dow);
    dt.setDate(dt.getDate() + diff);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  }

  function isoToEpoch(isoDate) {
    const [y, m, d] = isoDate.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  }

  function isSessionComplete(s) {
    if (!s || !s.exercises || !s.exercises.length) return false;
    return s.exercises.every(ex => ex.sets.every(st => st.completed));
  }

  function isSessionStarted(s) {
    if (!s || !s.exercises) return false;
    return s.exercises.some(ex => ex.sets.some(st => st.completed));
  }

  function findAutoTargetIndex(list) {
    if (!list.length) return 0;
    const today = todayIso();
    const exactToday = list.findIndex(s => s.date === today);
    if (exactToday !== -1) return exactToday;
    const nextUpcoming = list.findIndex(s => s.date >= today && !isSessionComplete(s));
    if (nextUpcoming !== -1) return nextUpcoming;
    return list.length - 1;
  }

  function getExerciseCategory(ex, liftRank) {
    if (ex.isCardio) return 'cardio';
    const n = ex.name.toLowerCase();
    const isAccessoryKeyword = /(curl|extension|hyper|raise|fly|pulldown|pushdown|face pull|plank|crunch|calf|shrug|circuit|core|ab)/i.test(n);
    if (liftRank >= 3 || isAccessoryKeyword) return 'accessory';
    return 'main';
  }

  function isBodyweightCircuit(ex) {
    if (ex.isCardio) return false;
    const allZeroWeight = ex.sets.every(st => !st.weight || Number(st.weight) === 0);
    const hasCircuitName = /(circuit|core|ab|conditioning)/i.test(ex.name);
    return allZeroWeight && (hasCircuitName || ex.sets.length >= 2);
  }

  function getCardioConfig(modalityName) {
    const n = String(modalityName || '').toLowerCase();
    if (/(stair|step|climb)/i.test(n)) {
      return { unit: 'floors', step: 1, decimals: 0, rateUnit: 'flr/min', rateType: 'rate' };
    }
    if (/(assault|air|bike|cycle|erg|ski)/i.test(n)) {
      return { unit: 'cal', step: 5, decimals: 0, rateUnit: 'cal/min', rateType: 'rate' };
    }
    if (/(run|jog|sprint|treadmill|walk|row)/i.test(n)) {
      return { unit: 'mi', step: 0.1, decimals: 1, rateUnit: '/mi', rateType: 'pace' };
    }
    return { unit: 'dist', step: 0.1, decimals: 1, rateUnit: '/min', rateType: 'rate' };
  }

  function formatPaceOrRate(mins, dist, cfg) {
    if (!dist || dist <= 0 || !mins || mins <= 0) return `0 ${cfg.rateUnit}`;
    if (cfg.rateType === 'pace') {
      const paceDecimal = mins / dist;
      const pMin = Math.floor(paceDecimal);
      const pSec = Math.round((paceDecimal - pMin) * 60);
      const secStr = String(pSec === 60 ? 0 : pSec).padStart(2, '0');
      const minAdj = pSec === 60 ? pMin + 1 : pMin;
      return `${minAdj}:${secStr} /mi`;
    }
    return `${(dist / mins).toFixed(1)} ${cfg.rateUnit}`;
  }

  function resolveCarryForwardMoves(list) {
    const lastKnownByExercise = {};
    list.forEach(s => {
      s.exercises.forEach(ex => {
        if (!isBodyweightCircuit(ex)) return;
        const explicitNotes = ex.sets.map(st => String(st.moveName || '').trim());
        const hasAnyExplicit = explicitNotes.some(Boolean);

        if (hasAnyExplicit) {
          if (!lastKnownByExercise[ex.name]) lastKnownByExercise[ex.name] = [];
          explicitNotes.forEach((n, idx) => {
            if (n) lastKnownByExercise[ex.name][idx] = n;
          });
        } else if (lastKnownByExercise[ex.name]) {
          ex.sets.forEach((st, idx) => {
            if (!st.moveName && lastKnownByExercise[ex.name][idx]) {
              st.moveName = lastKnownByExercise[ex.name][idx];
              st.isInherited = true;
            }
          });
        }
      });
    });
  }

  function openMovePicker(exIdx, setIdx, mode = 'circuit') {
    pickerTarget = { exIdx, setIdx, mode };
    const ex = sessions[currentIdx].exercises[exIdx];
    const st = ex.sets[setIdx];
    const currentMove = String(st.moveName || (mode === 'cardio' ? ex.name : '')).trim();

    document.getElementById('movePickerTitle').textContent = mode === 'cardio'
      ? 'Select Conditioning Modality'
      : `${ex.name} • Move ${setIdx + 1}`;
    document.getElementById('customMoveInput').value = '';
    document.getElementById('customMoveInput').placeholder = mode === 'cardio'
      ? 'e.g., Rowing Erg, Heavy Bag'
      : 'e.g., Landmine Anti-Rot.';

    const pool = new Set(mode === 'cardio' ? cardioOptions : circuitOptions);
    if (mode === 'cardio') {
      pool.add(ex.name);
      sessions.forEach(s => s.exercises.forEach(e => {
        if (e.isCardio) {
          pool.add(e.name);
          e.sets.forEach(setItem => {
            if (setItem.moveName) pool.add(String(setItem.moveName).trim());
          });
        }
      }));
    } else {
      sessions.forEach(s => s.exercises.forEach(e => {
        if (e.name === ex.name) {
          e.sets.forEach(setItem => {
            if (setItem.moveName) pool.add(String(setItem.moveName).trim());
          });
        }
      }));
    }

    const optionsList = Array.from(pool).filter(Boolean);
    const listEl = document.getElementById('movePickerOptions');
    const selectedCls = mode === 'cardio' ? 'selected-cardio' : 'selected';
    const checkColor = mode === 'cardio' ? 'var(--green)' : 'var(--purple)';

    if (optionsList.length === 0) {
      const colRef = mode === 'cardio' ? 'Config!L2:L' : 'Config!J2:J';
      listEl.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:6px 0;">No exercises found in <b>${colRef}</b> yet. Type one below to set it now.</div>`;
    } else {
      listEl.innerHTML = optionsList.map(opt => {
        const isSelected = opt.toLowerCase() === currentMove.toLowerCase();
        const safeOpt = opt.replace(/'/g, "\\'");
        return `
          <button class="option-item ${isSelected ? selectedCls : ''}" onclick="selectCircuitMove('${safeOpt}')">
            <span>${opt}</span>
            ${isSelected ? `<span style="color:${checkColor};font-size:12px;">Selected ✓</span>` : ''}
          </button>
        `;
      }).join('');
    }

    document.getElementById('movePickerModal').classList.add('open');
  }

  function closeMovePicker(e) {
    if (e && e.target && e.target.id !== 'movePickerModal') return;
    document.getElementById('movePickerModal').classList.remove('open');
    pickerTarget = null;
  }

  function selectCircuitMove(moveName) {
    if (!pickerTarget) return;
    const { exIdx, setIdx, mode } = pickerTarget;
    const ex = sessions[currentIdx].exercises[exIdx];
    const st = ex.sets[setIdx];
    if (st.origMoveName === undefined) st.origMoveName = String(st.moveName || '');

    const clean = String(moveName || '').trim();
    if (mode === 'cardio' && clean.toLowerCase() === ex.name.toLowerCase()) {
      st.moveName = '';
    } else {
      st.moveName = clean;
    }

    st.isInherited = false;
    st.moveModified = (st.moveName !== st.origMoveName);

    closeMovePicker();
    syncDirtyState();
    render();
  }

  function applyCustomMove() {
    const val = document.getElementById('customMoveInput').value.trim();
    if (!val) return;
    selectCircuitMove(val);
  }

  function calcPlates(weight, useColor = false) {
    if (!weight || weight <= 45) return 'Bar only';
    const perSide = +( (weight - 45) / 2 ).toFixed(2);
    if (perSide <= 0 || Math.round(perSide * 100) % 125 !== 0) {
      return `${perSide} lb/side`;
    }
    const plates = [45, 35, 25, 10, 5, 2.5, 1.25];
    const plateClass = {
      45: 'plate-45',
      35: 'plate-35',
      25: 'plate-25',
      10: 'plate-10',
      5: 'plate-std',
      2.5: 'plate-std',
      1.25: 'plate-1-25'
    };
    let rem = perSide;
    const out = [];
    for (const p of plates) {
      while (rem >= p - 0.001) {
        out.push(useColor ? `<span class="${plateClass[p]}">${p}</span>` : `${p}`);
        rem = +(rem - p).toFixed(2);
      }
    }
    return out.length ? `${out.join(' ')} / side` : 'Bar only';
  }

  function formatDisplayDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    });
  }

  function formatShortTon(lbs) {
    return lbs >= 1000 ? `${(lbs / 1000).toFixed(1)}k lb` : `${Math.round(lbs)} lb`;
  }

  function setSyncStatus(text, cls) {
    const pill = document.getElementById('syncPill');
    pill.textContent = text;
    pill.className = 'sync-pill ' + (cls || '');
  }

  function getComparableSets(s) {
    if (!s || !s.exercises) return [];
    const out = [];
    s.exercises.forEach(ex => {
      ex.sets.forEach(st => {
        const reps = st.completed
          ? (hasValue(st.loggedReps) ? Number(st.loggedReps) : Number(st.goal || 5))
          : '';
        out.push({
          w: Number(st.weight || 0),
          r: reps,
          c: Boolean(st.completed),
          m: String(st.moveName || '')
        });
      });
    });
    return out;
  }

  function captureSavedSnapshot() {
    const s = sessions[currentIdx];
    if (s && s.exercises) {
      s.exercises.forEach(ex => {
        ex.sets.forEach(st => {
          st.origWeight = Number(st.weight || 0);
          st.weightModified = false;
          st.origMoveName = String(st.moveName || '');
          st.moveModified = false;
        });
      });
    }
    savedSnapshot = JSON.stringify(getComparableSets(s));
    syncDirtyState();
  }

  function getModifiedSetCount() {
    if (!savedSnapshot || !sessions[currentIdx]) return 0;
    const orig = JSON.parse(savedSnapshot);
    const curr = getComparableSets(sessions[currentIdx]);
    if (orig.length !== curr.length) return curr.length;

    let diffs = 0;
    for (let i = 0; i < curr.length; i++) {
      if (orig[i].w !== curr[i].w || orig[i].r !== curr[i].r || orig[i].c !== curr[i].c || orig[i].m !== curr[i].m) {
        diffs++;
      }
    }
    return diffs;
  }

  function syncDirtyState() {
    const diffs = getModifiedSetCount();
    const fab = document.getElementById('saveFab');
    const lbl = document.getElementById('saveFabLabel');
    const restActive = document.getElementById('restBar').classList.contains('active');
    const show = diffs > 0 && activeTab === 'workout' && sessions.length > 0;

    fab.classList.toggle('visible', show);
    fab.classList.toggle('above-timer', restActive);

    if (show) {
      lbl.textContent = diffs === 1 ? 'Save 1 Change' : `Save ${diffs} Changes`;
      setSyncStatus('Unsaved Changes', 'dirty');
    } else if (sessions.length > 0) {
      if (isOffline) {
        setSyncStatus('Cached (Offline)', '');
      } else {
        setSyncStatus('Synced ✓', 'live');
      }
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    ['workout', 'progress', 'calendar'].forEach(t => {
      document.getElementById(`view-${t}`).style.display = t === tab ? 'block' : 'none';
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    });
    syncDirtyState();
    if (tab === 'progress') renderProgress();
    if (tab === 'calendar') renderCalendar();
  }

  function hydrateFromLocalCache() {
    try {
      const cachedAi = localStorage.getItem('gymlog_ai_cache');
      if (cachedAi) aiInsights = JSON.parse(cachedAi);

      const cachedOpts = localStorage.getItem('gymlog_circuit_opts');
      if (cachedOpts) circuitOptions = JSON.parse(cachedOpts);

      const cachedCardio = localStorage.getItem('gymlog_cardio_opts');
      if (cachedCardio) cardioOptions = JSON.parse(cachedCardio);

      const cached = localStorage.getItem('gymlog_cache');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length > 0) {
          sessions = parsed;
          resolveCarryForwardMoves(sessions);
          targetIdx = findAutoTargetIndex(sessions);
          currentIdx = targetIdx;
          if (selectedCalendarIdx === null) {
            selectedCalendarIdx = targetIdx;
          }
          if (sessions[targetIdx]) {
            const [y, m] = sessions[targetIdx].date.split('-').map(Number);
            calYear = y;
            calMonth = m - 1;
          }
          captureSavedSnapshot();
          render();
        }
      }
    } catch (e) {}
  }

  async function refreshFromSheet(isRetry = false, forceBypass = false) {
    if (!SCRIPT_URL || SCRIPT_URL.includes("PASTE_YOUR")) {
      setSyncStatus('Missing URL', '');
      return;
    }
    if (getModifiedSetCount() === 0) {
      setSyncStatus('Syncing...', 'syncing');
    }

    try {
      const sep = SCRIPT_URL.includes('?') ? '&' : '?';
      const fetchUrl = forceBypass ? `${SCRIPT_URL}${sep}force=1` : SCRIPT_URL;
      const resp = await fetch(fetchUrl, { redirect: 'follow', cache: 'no-store' });
      const res = await resp.json();

      if (res && res.sessions) {
        isOffline = false;
        if (Array.isArray(res.circuitOptions)) {
          circuitOptions = res.circuitOptions;
          localStorage.setItem('gymlog_circuit_opts', JSON.stringify(circuitOptions));
        }
        if (Array.isArray(res.cardioOptions)) {
          cardioOptions = res.cardioOptions;
          localStorage.setItem('gymlog_cardio_opts', JSON.stringify(cardioOptions));
        }
        if (res.aiInsights) {
          aiInsights = res.aiInsights;
          localStorage.setItem('gymlog_ai_cache', JSON.stringify(aiInsights));
        }

        if (getModifiedSetCount() > 0 && sessions[currentIdx]) {
          localStorage.setItem('gymlog_cache', JSON.stringify(res.sessions));
          syncDirtyState();
          return;
        }

        const activeId = sessions[currentIdx] ? sessions[currentIdx].id : null;
        sessions = res.sessions;
        resolveCarryForwardMoves(sessions);
        localStorage.setItem('gymlog_cache', JSON.stringify(sessions));
        targetIdx = findAutoTargetIndex(sessions);

        if (userNavigated && activeId) {
          const foundIdx = sessions.findIndex(s => s.id === activeId);
          currentIdx = foundIdx !== -1 ? foundIdx : targetIdx;
        } else {
          currentIdx = targetIdx;
        }

        if (selectedCalendarIdx === null) {
          selectedCalendarIdx = targetIdx;
        }
        if (!userNavigated && sessions[targetIdx]) {
          const [y, m] = sessions[targetIdx].date.split('-').map(Number);
          calYear = y;
          calMonth = m - 1;
        }

        captureSavedSnapshot();
        render();
        if (activeTab === 'progress') renderProgress();
        if (activeTab === 'calendar') renderCalendar();
      }
    } catch (err) {
      if (!isRetry) {
        setTimeout(() => refreshFromSheet(true, forceBypass), 1200);
        return;
      }
      isOffline = true;
      if (sessions.length > 0) {
        syncDirtyState();
      } else {
        setSyncStatus('Sync Error', '');
      }
    }
  }

  async function forceRefreshAiInsights(e) {
    if (e) e.stopPropagation();
    if (refreshingInsights || !SCRIPT_URL || SCRIPT_URL.includes("PASTE_YOUR")) return;
    refreshingInsights = true;
    renderProgress();

    try {
      const sep = SCRIPT_URL.includes('?') ? '&' : '?';
      const resp = await fetch(`${SCRIPT_URL}${sep}action=refreshInsights`, { redirect: 'follow' });
      const res = await resp.json();
      if (res && res.aiInsights) {
        aiInsights = res.aiInsights;
        localStorage.setItem('gymlog_ai_cache', JSON.stringify(aiInsights));
      }
    } catch (err) {
      alert('Could not refresh coach brief: ' + err.message);
    } finally {
      refreshingInsights = false;
      renderProgress();
    }
  }

  function stepDay(delta) {
    const next = currentIdx + delta;
    if (next >= 0 && next < sessions.length) {
      userNavigated = true;
      currentIdx = next;
      captureSavedSnapshot();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function jumpToTarget() {
    userNavigated = false;
    currentIdx = targetIdx;
    captureSavedSnapshot();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function jumpToSessionIndex(idx) {
    if (idx >= 0 && idx < sessions.length) {
      userNavigated = (idx !== targetIdx);
      currentIdx = idx;
      captureSavedSnapshot();
      switchTab('workout');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function selectCalendarSession(idx) {
    selectedCalendarIdx = (selectedCalendarIdx === idx) ? null : idx;
    renderCalendar();
  }

  function adjustWeight(exIdx, setIdx, delta) {
    const st = sessions[currentIdx].exercises[exIdx].sets[setIdx];
    if (st.origWeight === undefined) st.origWeight = Number(st.weight || 0);
    st.weight = Math.max(0, +(st.weight + delta).toFixed(2));
    st.weightModified = (st.weight !== st.origWeight);
    syncDirtyState();
    render();
  }

  function adjustReps(exIdx, setIdx, delta) {
    const st = sessions[currentIdx].exercises[exIdx].sets[setIdx];
    const base = hasValue(st.loggedReps) ? Number(st.loggedReps) : Number(st.goal || 5);
    st.loggedReps = Math.max(0, base + delta);
    syncDirtyState();
    render();
  }

  function toggleSet(exIdx, setIdx) {
    const ex = sessions[currentIdx].exercises[exIdx];
    const st = ex.sets[setIdx];
    st.completed = !st.completed;
    if (st.completed) {
      if (!hasValue(st.loggedReps)) st.loggedReps = Number(st.goal || 5);
      if (!ex.isCardio && !isBodyweightCircuit(ex)) {
        const liftRank = sessions[currentIdx].exercises.slice(0, exIdx).filter(e => !e.isCardio).length;
        const cat = getExerciseCategory(ex, liftRank);
        startRest(cat === 'main' ? 150 : 90);
      }
    } else if (getModifiedSetCount() === 0) {
      stopRest();
    }
    syncDirtyState();
    render();
  }

  async function saveCurrentSession() {
    const session = sessions[currentIdx];
    const fab = document.getElementById('saveFab');
    const lbl = document.getElementById('saveFabLabel');
    fab.disabled = true;
    lbl.textContent = 'Saving...';
    setSyncStatus('Saving...', 'syncing');

    try {
      const resp = await fetch(SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(session)
      });
      const res = await resp.json();
      if (res && res.sessions) {
        isOffline = false;
        if (Array.isArray(res.circuitOptions)) {
          circuitOptions = res.circuitOptions;
          localStorage.setItem('gymlog_circuit_opts', JSON.stringify(circuitOptions));
        }
        if (Array.isArray(res.cardioOptions)) {
          cardioOptions = res.cardioOptions;
          localStorage.setItem('gymlog_cardio_opts', JSON.stringify(cardioOptions));
        }
        const activeId = session.id;
        sessions = res.sessions;
        resolveCarryForwardMoves(sessions);
        localStorage.setItem('gymlog_cache', JSON.stringify(sessions));
        targetIdx = findAutoTargetIndex(sessions);
        const foundIdx = sessions.findIndex(s => s.id === activeId);
        currentIdx = foundIdx !== -1 ? foundIdx : targetIdx;
      }
      fab.disabled = false;
      captureSavedSnapshot();
      render();
    } catch (err) {
      fab.disabled = false;
      syncDirtyState();
      setSyncStatus('Save Failed', '');
      alert('Save failed: ' + err.message);
    }
  }

  function startRest(sec) {
    restSeconds = sec;
    document.getElementById('restBar').classList.add('active');
    syncDirtyState();
    updateRestClock();
    clearInterval(restInterval);
    restInterval = setInterval(() => {
      restSeconds--;
      if (restSeconds <= 0) { stopRest(); return; }
      updateRestClock();
    }, 1000);
  }

  function adjustRest(sec) {
    restSeconds = Math.max(5, restSeconds + sec);
    updateRestClock();
  }

  function stopRest() {
    clearInterval(restInterval);
    restInterval = null;
    document.getElementById('restBar').classList.remove('active');
    syncDirtyState();
  }

  function updateRestClock() {
    const m = String(Math.floor(restSeconds / 60)).padStart(2, '0');
    const s = String(restSeconds % 60).padStart(2, '0');
    document.getElementById('restClock').textContent = `${m}:${s}`;
  }

  function scrollToSection(cat) {
    const el = document.getElementById(`sec-${cat}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function render() {
    const container = document.getElementById('workoutContainer');
    const pillStrip = document.getElementById('pillStrip');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const jumpBtn = document.getElementById('jumpNextBtn');
    const progWrap = document.getElementById('progWrap');

    if (!sessions.length) {
      document.getElementById('navDate').textContent = 'No Workouts Found';
      document.getElementById('navMeta').innerHTML = '';
      pillStrip.innerHTML = '';
      progWrap.style.display = 'none';
      container.innerHTML = `<div class="empty-state">No scheduled <b>Workout</b> blocks were found in your monthly tabs yet.</div>`;
      return;
    }

    prevBtn.disabled = currentIdx <= 0;
    nextBtn.disabled = currentIdx >= sessions.length - 1;
    jumpBtn.style.display = currentIdx !== targetIdx ? 'block' : 'none';

    const s = sessions[currentIdx];
    const today = todayIso();
    const complete = isSessionComplete(s);
    const started = isSessionStarted(s);

    let totalSets = 0;
    let doneSets = 0;
    s.exercises.forEach(ex => ex.sets.forEach(st => {
      totalSets++;
      if (st.completed) doneSets++;
    }));
    const pct = totalSets ? Math.round((doneSets / totalSets) * 100) : 0;
    progWrap.style.display = 'block';
    document.getElementById('progText').textContent = `${doneSets} / ${totalSets} Sets Done`;
    document.getElementById('progPct').textContent = `${pct}%`;
    document.getElementById('progFill').style.width = `${pct}%`;

    document.getElementById('navDate').textContent = formatDisplayDate(s.date);

    let statusBadge = '';
    if (complete) {
      statusBadge = `<span class="badge badge-done">Completed &#10003;</span>`;
    } else if (s.date === today) {
      statusBadge = `<span class="badge badge-next">Today &#8226; Next Up</span>`;
    } else if (currentIdx === targetIdx) {
      statusBadge = `<span class="badge badge-next">Next Up</span>`;
    } else if (s.date < today) {
      statusBadge = `<span class="badge badge-missed">${started ? 'Partial Past' : 'Past Unlogged'}</span>`;
    } else {
      statusBadge = `<span class="badge badge-upcoming">Upcoming</span>`;
    }

    document.getElementById('navMeta').innerHTML = `
      <span style="font-size:12px;font-weight:700;color:var(--accent);">${s.split}</span>
      <span style="font-size:11px;color:var(--muted);">(${s.tab})</span>
      ${statusBadge}
    `;

    const sectionState = {
      main: { label: 'Main Compounds', present: false, allDone: true },
      accessory: { label: 'Accessories', present: false, allDone: true },
      cardio: { label: 'Conditioning', present: false, allDone: true }
    };

    let liftRank = 0;
    let lastSection = '';
    const sectionTitles = {
      main: 'Main Compounds',
      accessory: 'Accessories',
      cardio: 'Conditioning'
    };

    container.innerHTML = s.exercises.map((ex, exIdx) => {
      const cat = getExerciseCategory(ex, liftRank);
      if (!ex.isCardio) liftRank++;

      sectionState[cat].present = true;
      if (!ex.sets.every(st => st.completed)) {
        sectionState[cat].allDone = false;
      }

      let sectionHtml = '';
      if (cat !== lastSection) {
        lastSection = cat;
        sectionHtml = `<div id="sec-${cat}" class="sec-header">${sectionTitles[cat]}</div>`;
      }

      const isCircuit = isBodyweightCircuit(ex);
      const tagHtml = cat === 'main'
        ? `<span class="cat-tag cat-main">Main Lift</span>`
        : cat === 'accessory'
          ? `<span class="cat-tag cat-acc">${isCircuit ? 'Circuit' : 'Accessory'}</span>`
          : `<span class="cat-tag cat-cardio">Cardio</span>`;

      const firstSet = ex.sets[0] || {};
      const activeCardioName = cat === 'cardio' ? (firstSet.moveName || ex.name) : ex.name;

      const titleHtml = cat === 'cardio'
        ? `<button class="ex-swap-btn ${firstSet.moveModified ? 'modified-move' : ''}" onclick="openMovePicker(${exIdx}, 0, 'cardio')" title="Tap to change modality">
             <span>${activeCardioName}</span>
             <span style="font-size:11px;color:var(--green);">&#9662;</span>
           </button>`
        : `<div class="ex-name">${ex.name}</div>`;

      const topWeight = Math.max(...ex.sets.map(st => st.weight || 0));
      const rightLabel = cat === 'cardio'
        ? `Goal: ${firstSet.goal || 15} min`
        : isCircuit
          ? `${ex.sets.length} Moves`
          : (topWeight > 0 ? `Top: ${topWeight} lb` : 'Bodyweight');

      const activeSetIdx = ex.sets.findIndex(item => !item.completed);

      const rowsHtml = ex.sets.map((st, setIdx) => {
        const displayReps = hasValue(st.loggedReps) ? Number(st.loggedReps) : Number(st.goal || 5);

        if (cat === 'cardio') {
          const modName = st.moveName || ex.name;
          const cfg = getCardioConfig(modName);
          const distVal = cfg.decimals > 0 ? Number(st.weight || 0).toFixed(cfg.decimals) : Math.round(Number(st.weight || 0));
          const rateHint = formatPaceOrRate(displayReps, Number(st.weight || 0), cfg);

          return `
            <div class="set-row cardio-row">
              <div class="stepper">
                <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, -1)">&#8722;</button>
                <div class="step-val">
                  <span class="step-main">${displayReps} min</span>
                  <span class="step-hint">Goal: ${st.goal} min</span>
                </div>
                <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, 1)">+</button>
              </div>
              <div class="stepper ${st.weightModified ? 'modified-weight' : ''}">
                <button class="step-btn" onclick="adjustWeight(${exIdx}, ${setIdx}, -${cfg.step})">&#8722;</button>
                <div class="step-val">
                  <span class="step-main">${distVal} ${cfg.unit}</span>
                  <span class="step-hint">${rateHint}</span>
                </div>
                <button class="step-btn" onclick="adjustWeight(${exIdx}, ${setIdx}, ${cfg.step})">+</button>
              </div>
              <button class="check-btn ${st.completed ? 'checked' : ''}" onclick="toggleSet(${exIdx}, ${setIdx})">&#10003;</button>
            </div>
          `;
        }

        if (isCircuit) {
          const moveLbl = st.moveName || `Select Move ${setIdx + 1}`;
          return `
            <div class="set-row circuit-row">
              <button class="move-tag-btn ${st.moveModified ? 'modified-move' : ''}" onclick="openMovePicker(${exIdx}, ${setIdx}, 'circuit')">
                <span class="move-tag-top">
                  <span>Move ${setIdx + 1}</span>
                  <span>&#9662;</span>
                </span>
                <span class="move-tag-name" style="${st.moveName ? '' : 'color:var(--muted);'}">${moveLbl}</span>
              </button>
              <div class="stepper">
                <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, -1)">&#8722;</button>
                <div class="step-val">
                  <span class="step-main">${displayReps} reps</span>
                  <span class="step-hint">Goal: ${st.goal}</span>
                </div>
                <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, 1)">+</button>
              </div>
              <button class="check-btn ${st.completed ? 'checked' : ''}" onclick="toggleSet(${exIdx}, ${setIdx})">&#10003;</button>
            </div>
          `;
        }

        const isNextSet = (setIdx === activeSetIdx);
        const weightHint = cat === 'main'
          ? calcPlates(st.weight, isNextSet)
          : (st.weight > 0 ? 'Accessory' : 'Bodyweight');
        const fxBadge = (st.hasFormula && !st.weightModified) ? `<span class="fx-dot" title="Formula-linked cell"></span>` : '';

        return `
          <div class="set-row">
            <div class="set-num">S${setIdx + 1}</div>
            <div class="stepper ${st.weightModified ? 'modified-weight' : ''}">
              <button class="step-btn" onclick="adjustWeight(${exIdx}, ${setIdx}, -2.5)">&#8722;</button>
              <div class="step-val">
                <span class="step-main">${st.weight} lb${fxBadge}</span>
                <span class="step-hint">${weightHint}</span>
              </div>
              <button class="step-btn" onclick="adjustWeight(${exIdx}, ${setIdx}, 2.5)">+</button>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, -1)">&#8722;</button>
              <div class="step-val">
                <span class="step-main">${displayReps} reps</span>
                <span class="step-hint">Goal: ${st.goal}</span>
              </div>
              <button class="step-btn" onclick="adjustReps(${exIdx}, ${setIdx}, 1)">+</button>
            </div>
            <button class="check-btn ${st.completed ? 'checked' : ''}" onclick="toggleSet(${exIdx}, ${setIdx})">&#10003;</button>
          </div>
        `;
      }).join('');

      return `
        ${sectionHtml}
        <div id="ex-card-${exIdx}" class="ex-card">
          <div class="ex-header">
            <div class="ex-title-group">
              ${titleHtml}
              ${tagHtml}
            </div>
            <div class="ex-sub">${rightLabel}</div>
          </div>
          ${rowsHtml}
        </div>
      `;
    }).join('');

    pillStrip.innerHTML = ['main', 'accessory', 'cardio']
      .filter(cat => sectionState[cat].present)
      .map(cat => {
        const st = sectionState[cat];
        return `<button class="sec-pill ${st.allDone ? 'done' : ''}" onclick="scrollToSection('${cat}')">${st.label}${st.allDone ? ' ✓' : ''}</button>`;
      }).join('');
  }

  function toggleExpandCard(name) {
    expandedCardName = (expandedCardName === name) ? null : name;
    renderProgress();
  }

  function computeWeeklyPeaks(rawPoints) {
    if (!rawPoints || !rawPoints.length) return [];
    const byWeek = {};
    rawPoints.forEach(p => {
      const wk = getMondayWeekKey(p.date);
      if (!byWeek[wk] || p.metric > byWeek[wk].metric) {
        byWeek[wk] = { weekKey: wk, ...p };
      }
    });
    return Object.keys(byWeek).sort().map(wk => byWeek[wk]);
  }

  function buildDualLayerSparklineSvg(rawPoints, strokeColor, useWeeklyPeak) {
    if (!rawPoints || rawPoints.length === 0) {
      return `<div style="height:34px;display:flex;align-items:center;font-size:10px;color:var(--muted);">No trend yet</div>`;
    }

    const linePoints = useWeeklyPeak ? computeWeeklyPeaks(rawPoints) : rawPoints;
    const w = 120, h = 34, padX = 5, padY = 5;
    const allVals = rawPoints.map(p => p.metric);
    const minV = Math.min(...allVals) - 2;
    const maxV = Math.max(...allVals) + 2;
    const span = Math.max(1, maxV - minV);

    const minT = isoToEpoch(rawPoints[0].date);
    const maxT = isoToEpoch(rawPoints[rawPoints.length - 1].date);
    const timeSpan = Math.max(1, maxT - minT);

    const mapPoint = (p, idx, total) => {
      const x = (maxT === minT)
        ? (total === 1 ? w / 2 : padX + (idx / (total - 1)) * (w - padX * 2))
        : padX + ((isoToEpoch(p.date) - minT) / timeSpan) * (w - padX * 2);
      const y = h - padY - ((p.metric - minV) / span) * (h - padY * 2);
      return { x, y };
    };

    const rawDotsHtml = useWeeklyPeak
      ? rawPoints.map((p, i) => {
          const c = mapPoint(p, i, rawPoints.length);
          return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2" fill="${strokeColor}" opacity="0.32" />`;
        }).join('')
      : '';

    if (linePoints.length === 1) {
      const c = mapPoint(linePoints[0], 0, 1);
      return `
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:34px;overflow:visible;">
          <line x1="6" y1="${c.y.toFixed(1)}" x2="114" y2="${c.y.toFixed(1)}" stroke="${strokeColor}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.45" />
          ${rawDotsHtml}
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${strokeColor}" />
        </svg>
      `;
    }

    const mappedLine = linePoints.map((p, i) => mapPoint(p, i, linePoints.length));
    const poly = mappedLine.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const last = mappedLine[mappedLine.length - 1];

    return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:34px;overflow:visible;">
        ${rawDotsHtml}
        <polyline fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${poly}" />
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${strokeColor}" />
      </svg>
    `;
  }

  function buildCircuitExpandedHtml(rawPoints, moveStatsMap) {
    if (!rawPoints || rawPoints.length === 0) {
      return `<div style="text-align:center;padding:16px 0;color:var(--muted);font-size:12px;">Complete at least 1 circuit move to view breakdown.</div>`;
    }

    const entries = Object.entries(moveStatsMap || {})
      .map(([name, info]) => ({ name, ...info }))
      .sort((a, b) => b.totalReps - a.totalReps);

    const maxReps = entries.length ? Math.max(...entries.map(e => e.totalReps), 1) : 1;

    const barsHtml = entries.length ? `
      <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;">Volume &amp; Avg Reps by Movement</div>
      <div class="circuit-bar-list">
        ${entries.map(item => {
          const pct = Math.max(8, Math.round((item.totalReps / maxReps) * 100));
          const avg = Math.round(item.totalReps / Math.max(1, item.count));
          return `
            <div class="cbar-row">
              <div class="cbar-top">
                <span class="cbar-name">${item.name}</span>
                <span class="cbar-meta">${item.count}× • ${item.totalReps} reps (avg ${avg})</span>
              </div>
              <div class="cbar-track"><div class="cbar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('')}
      </div>
    ` : '';

    const pillsHtml = `
      <div class="history-pills">
        ${rawPoints.slice().reverse().map(p => `
          <span class="hist-pill">${p.date.slice(5)}: <b>${p.pillText}</b> (${p.metric}%)</span>
        `).join('')}
      </div>
    `;

    return `${barsHtml}${pillsHtml}`;
  }

  function buildDualLayerExpandedSvg(rawPoints, mode) {
    const strokeColor = mode === 'cardio' ? '#22c55e' : (mode === 'accessory' ? '#a78bfa' : '#38bdf8');
    const textColor = mode === 'cardio' ? 'var(--green)' : (mode === 'accessory' ? 'var(--purple)' : 'var(--accent)');
    const unit = mode === 'cardio' ? (rawPoints[0]?.rateUnit || '/min') : 'lb';
    const metricLabel = mode === 'cardio'
      ? 'Output Rate'
      : (mode === 'accessory' ? 'Top Working Weight' : 'Weekly Peak e1RM');
    const gradId = mode === 'cardio' ? 'areaGradCardio' : (mode === 'accessory' ? 'areaGradAcc' : 'areaGradMain');
    const useWeeklyPeak = (mode === 'main');

    if (!rawPoints || rawPoints.length === 0) {
      return `<div style="text-align:center;padding:16px 0;color:var(--muted);font-size:12px;">Complete at least 1 set to plot progression.</div>`;
    }

    const pillsHtml = `
      <div class="history-pills">
        ${rawPoints.slice().reverse().map(p => `
          <span class="hist-pill">${p.date.slice(5)}: <b>${p.pillText || (p.weight > 0 ? `${p.weight}×${p.reps}` : `${p.reps}r`)}</b>${mode === 'main' ? ` (${p.metric} lb)` : ''}</span>
        `).join('')}
      </div>
    `;

    const linePoints = useWeeklyPeak ? computeWeeklyPeaks(rawPoints) : rawPoints;

    if (linePoints.length === 1 && rawPoints.length === 1) {
      const p = linePoints[0];
      return `
        <div style="text-align:center;padding:12px 0 4px 0;">
          <div style="font-size:18px;font-weight:900;color:${textColor};">${p.displayMetric || (p.metric + ' ' + unit)} <span style="font-size:11px;color:var(--muted);">${metricLabel}</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">Logged ${p.pillText || (p.weight > 0 ? `${p.weight} lb × ${p.reps} reps` : `${p.reps} reps`)} on ${p.date}</div>
        </div>
        ${pillsHtml}
      `;
    }

    const w = 320, h = 118, padX = 16, padY = 16;
    const allVals = rawPoints.map(p => p.metric);
    const padVal = Math.max(1, (Math.max(...allVals) - Math.min(...allVals)) * 0.15);
    const minV = Math.min(...allVals) - padVal;
    const maxV = Math.max(...allVals) + padVal;
    const span = Math.max(0.1, maxV - minV);

    const minT = isoToEpoch(rawPoints[0].date);
    const maxT = isoToEpoch(rawPoints[rawPoints.length - 1].date);
    const timeSpan = Math.max(1, maxT - minT);

    const mapPoint = (p, idx, total) => {
      const x = (maxT === minT)
        ? (total === 1 ? w / 2 : padX + (idx / (total - 1)) * (w - padX * 2))
        : padX + ((isoToEpoch(p.date) - minT) / timeSpan) * (w - padX * 2);
      const y = h - padY - ((p.metric - minV) / span) * (h - padY * 2);
      return { x, y, ...p };
    };

    const rawMapped = rawPoints.map((p, i) => mapPoint(p, i, rawPoints.length));
    const lineMapped = linePoints.map((p, i) => mapPoint(p, i, linePoints.length));

    const rawDotsSvg = useWeeklyPeak
      ? rawMapped.map(c => `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${strokeColor}" opacity="0.32" />
        `).join('')
      : '';

    const polyPoints = lineMapped.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const areaPoints = lineMapped.length > 1
      ? `${lineMapped[0].x.toFixed(1)},${h - padY} ${polyPoints} ${lineMapped[lineMapped.length - 1].x.toFixed(1)},${h - padY}`
      : '';

    const peakDotsSvg = lineMapped.map(c => `
      <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4.5" fill="${strokeColor}" stroke="#0b0e14" stroke-width="1.5" />
    `).join('');

    const first = linePoints[0];
    const latest = linePoints[linePoints.length - 1];
    const diff = +(latest.metric - first.metric).toFixed(2);
    const diffStr = diff >= 0 ? `+${diff} ${unit}` : `${diff} ${unit}`;

    const legendSub = useWeeklyPeak
      ? `<span style="font-size:10px;color:var(--muted);">&#9679; Weekly Peak Line &nbsp; &#9675; Individual Sessions</span>`
      : `<span style="font-size:10px;color:var(--muted);">${rawPoints.length} sessions logged</span>`;

    return `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
        <span style="font-size:11px;font-weight:700;color:var(--muted);">${metricLabel}</span>
        <span style="font-size:12px;font-weight:800;color:${diff >= 0 ? 'var(--green)' : 'var(--amber)'};">${diffStr} since ${first.date.slice(5)}</span>
      </div>
      <div style="margin-bottom:4px;">${legendSub}</div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:118px;overflow:visible;">
        <defs>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.28" />
            <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0" />
          </linearGradient>
        </defs>
        ${lineMapped.length > 1 ? `<polygon points="${areaPoints}" fill="url(#${gradId})" />` : ''}
        ${rawDotsSvg}
        ${lineMapped.length > 1 ? `<polyline fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyPoints}" />` : ''}
        ${peakDotsSvg}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px;">
        <span>${first.date} (${first.displayMetric || (first.metric + ' ' + unit)})</span>
        <span>${latest.date} (${latest.displayMetric || (latest.metric + ' ' + unit)})</span>
      </div>
      ${pillsHtml}
    `;
  }

  function renderProgress() {
    const box = document.getElementById('progressContainer');
    const mainLifts = ['Back Squat', 'Flat Bench', 'Barbell Row', 'Incline Bench', 'Deadlift'];
    const mainBestMap = {};
    const historyMap = {};
    const accessorySet = new Set();
    const accessoryStats = {};
    const cardioSet = new Set();
    const cardioStats = {};

    mainLifts.forEach(l => {
      mainBestMap[l] = { weight: 0, reps: 0, e1rm: 0, date: '' };
      historyMap[l] = [];
    });

    let completedWorkouts = 0;
    let totalCompletedSets = 0;
    let totalGoalsMetSets = 0;
    let totalTonnage = 0;
    const activeWeeks = new Set();

    let currentStreak = 0;
    for (let i = 0; i < sessions.length; i++) {
      const s = sessions[i];
      if (isSessionComplete(s)) {
        currentStreak++;
      } else if (isSessionStarted(s) || s.date < todayIso()) {
        currentStreak = 0;
      } else {
        break;
      }
    }

    sessions.forEach(s => {
      if (isSessionComplete(s)) completedWorkouts++;
      let liftRank = 0;
      let sessionHasCompletedWork = false;

      s.exercises.forEach(ex => {
        const cat = getExerciseCategory(ex, liftRank);
        if (!ex.isCardio) liftRank++;

        const circuitFlag = isBodyweightCircuit(ex);

        if (cat === 'accessory') {
          accessorySet.add(ex.name);
          if (!accessoryStats[ex.name]) {
            accessoryStats[ex.name] = {
              isCircuit: circuitFlag,
              bestWeight: 0,
              bestReps: 0,
              firstWeight: null,
              latestWeight: 0,
              totalReps: 0,
              totalGoalReps: 0,
              moveStats: {}
            };
          }
          if (!historyMap[ex.name]) historyMap[ex.name] = [];
        }

        let sessionMainBest = null;
        let sessionAccTop = { weight: 0, reps: 0 };
        let sessionMoveParts = [];
        let sessionCircuitReps = 0;
        let sessionCircuitGoal = 0;

        ex.sets.forEach((st, setIdx) => {
          if (!st.completed) return;
          sessionHasCompletedWork = true;
          const r = hasValue(st.loggedReps) ? Number(st.loggedReps) : Number(st.goal || 0);
          const g = Number(st.goal || 0);

          totalCompletedSets++;
          if (g <= 0 || r >= g) totalGoalsMetSets++;

          if (cat === 'cardio') {
            const modName = st.moveName || ex.name;
            const cfg = getCardioConfig(modName);
            const dist = Number(st.weight || 0);
            const rate = r > 0 ? +(dist / r).toFixed(2) : 0;

            cardioSet.add(modName);
            if (!cardioStats[modName]) {
              cardioStats[modName] = {
                cfg: cfg,
                totalMins: 0,
                totalDist: 0,
                sessionsCount: 0,
                bestRate: 0,
                bestRateDisplay: '',
                latestRateDisplay: ''
              };
            }
            if (!historyMap[`cardio_${modName}`]) historyMap[`cardio_${modName}`] = [];

            cardioStats[modName].totalMins += r;
            cardioStats[modName].totalDist = +(cardioStats[modName].totalDist + dist).toFixed(2);
            cardioStats[modName].sessionsCount++;

            const rateDisp = formatPaceOrRate(r, dist, cfg);
            if (dist > 0) {
              cardioStats[modName].latestRateDisplay = rateDisp;
              if (rate >= cardioStats[modName].bestRate) {
                cardioStats[modName].bestRate = rate;
                cardioStats[modName].bestRateDisplay = rateDisp;
              }
            }

            const distDisp = cfg.decimals > 0 ? dist.toFixed(cfg.decimals) : Math.round(dist);
            historyMap[`cardio_${modName}`].push({
              date: s.date,
              weight: dist,
              reps: r,
              metric: dist > 0 ? rate : r,
              rateUnit: dist > 0 ? (cfg.rateType === 'pace' ? 'mph' : cfg.rateUnit) : 'min',
              displayMetric: dist > 0 ? rateDisp : `${r} min`,
              pillText: dist > 0 ? `${r}m • ${distDisp} ${cfg.unit}` : `${r} min`
            });
          } else if (cat === 'main') {
            if (st.weight > 0) totalTonnage += st.weight * r;
            if (mainBestMap[ex.name] && st.weight > 0 && r > 0) {
              const est = Math.round(st.weight * (1 + r / 30));
              if (est > mainBestMap[ex.name].e1rm) {
                mainBestMap[ex.name] = { weight: st.weight, reps: r, e1rm: est, date: s.date };
              }
              if (!sessionMainBest || est > sessionMainBest.metric) {
                sessionMainBest = { date: s.date, weight: st.weight, reps: r, metric: est };
              }
            }
          } else if (cat === 'accessory') {
            if (st.weight > 0) totalTonnage += st.weight * r;
            accessoryStats[ex.name].totalReps += r;
            accessoryStats[ex.name].totalGoalReps += (g > 0 ? g : r);
            sessionCircuitReps += r;
            sessionCircuitGoal += (g > 0 ? g : r);

            const mLabel = st.moveName || `Move ${setIdx + 1}`;
            sessionMoveParts.push(`${mLabel} (${r})`);
            if (!accessoryStats[ex.name].moveStats[mLabel]) {
              accessoryStats[ex.name].moveStats[mLabel] = { totalReps: 0, count: 0 };
            }
            accessoryStats[ex.name].moveStats[mLabel].totalReps += r;
            accessoryStats[ex.name].moveStats[mLabel].count += 1;

            if (st.weight > accessoryStats[ex.name].bestWeight ||
               (st.weight === accessoryStats[ex.name].bestWeight && r > accessoryStats[ex.name].bestReps)) {
              accessoryStats[ex.name].bestWeight = st.weight;
              accessoryStats[ex.name].bestReps = r;
            }
            if (st.weight > sessionAccTop.weight ||
               (st.weight === sessionAccTop.weight && r > sessionAccTop.reps)) {
              sessionAccTop = { weight: st.weight, reps: r };
            }
          }
        });

        if (sessionMainBest && historyMap[ex.name]) {
          historyMap[ex.name].push(sessionMainBest);
        }
        if (cat === 'accessory' && sessionCircuitReps > 0) {
          if (circuitFlag) {
            const hitPct = sessionCircuitGoal > 0 ? Math.min(100, Math.round((sessionCircuitReps / sessionCircuitGoal) * 100)) : 100;
            historyMap[ex.name].push({
              date: s.date,
              weight: 0,
              reps: sessionCircuitReps,
              metric: hitPct,
              pillText: sessionMoveParts.join(' • ')
            });
          } else if (sessionAccTop.weight > 0) {
            if (accessoryStats[ex.name].firstWeight === null) {
              accessoryStats[ex.name].firstWeight = sessionAccTop.weight;
            }
            accessoryStats[ex.name].latestWeight = sessionAccTop.weight;
            historyMap[ex.name].push({
              date: s.date,
              weight: sessionAccTop.weight,
              reps: sessionAccTop.reps,
              metric: sessionAccTop.weight
            });
          }
        }
      });

      if (sessionHasCompletedWork) {
        activeWeeks.add(getMondayWeekKey(s.date));
      }
    });

    const goalHitPct = totalCompletedSets > 0 ? Math.round((totalGoalsMetSets / totalCompletedSets) * 100) : 0;
    const weeklyAvgTonnage = activeWeeks.size > 0 ? (totalTonnage / activeWeeks.size) : 0;

    const bullets = (aiInsights && Array.isArray(aiInsights.bullets) && aiInsights.bullets.length)
      ? aiInsights.bullets
      : ['Nightly AI Coach brief updates automatically at 9:00 PM on training days. Tap Update Now to generate immediately.'];
    const updatedLabel = (aiInsights && aiInsights.updatedAt) ? `Updated: ${aiInsights.updatedAt}` : 'Scheduled: 9:00 PM Daily';

    const aiCardHtml = `
      <div class="ai-card">
        <div class="ai-header">
          <div class="ai-title">&#10024; AI Coach Brief</div>
          <button class="sync-pill" onclick="forceRefreshAiInsights(event)" ${refreshingInsights ? 'disabled' : ''}>
            ${refreshingInsights ? 'Analyzing...' : '&#8635; Update Now'}
          </button>
        </div>
        <ul class="ai-bullet-list">
          ${bullets.map(b => `<li>${b}</li>`).join('')}
        </ul>
        <div class="ai-footer">
          <span>Auto-updates nightly at 9:00 PM</span>
          <span>${updatedLabel}</span>
        </div>
      </div>
    `;

    const kpiHtml = `
      <div class="kpi-row">
        <div class="kpi-box">
          <div>
            <div class="kpi-lbl">Workouts Done</div>
            <div class="kpi-val" style="color:var(--green);margin-top:2px;">${completedWorkouts}</div>
          </div>
          <span style="font-size:18px;">&#10003;</span>
        </div>
        <div class="kpi-box">
          <div>
            <div class="kpi-lbl">Goal Hit Rate</div>
            <div class="kpi-val" style="color:var(--accent);margin-top:2px;">${totalCompletedSets ? goalHitPct + '%' : '—'}</div>
          </div>
          <span style="font-size:15px;">&#127919;</span>
        </div>
        <div class="kpi-box">
          <div>
            <div class="kpi-lbl">Weekly Avg Vol</div>
            <div class="kpi-val" style="color:var(--purple);margin-top:2px;">${activeWeeks.size ? formatShortTon(weeklyAvgTonnage) : '—'}</div>
          </div>
        </div>
        <div class="kpi-box">
          <div>
            <div class="kpi-lbl">Active Streak</div>
            <div class="kpi-val" style="color:var(--green);margin-top:2px;">${currentStreak} ${currentStreak === 1 ? 'day' : 'days'}</div>
          </div>
          <span style="font-size:16px;">&#128293;</span>
        </div>
      </div>
    `;

    const mainCardsHtml = `<div class="sec-header">Main Compounds (Weekly Peak e1RM)</div><div class="stat-grid">` + mainLifts.map(name => {
      const b = mainBestMap[name];
      const pts = historyMap[name] || [];
      const isExpanded = expandedCardName === name;
      const safeName = name.replace(/'/g, "\\'");

      return `
        <div class="stat-box ${isExpanded ? 'expanded' : ''}" onclick="toggleExpandCard('${safeName}')">
          <div class="stat-top-row">
            <div class="stat-lbl">${name}</div>
            <span class="expand-hint">${isExpanded ? 'Close' : 'Expand'}</span>
          </div>
          <div class="stat-num">${b.e1rm ? b.e1rm + ' lb' : '—'}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">
            ${b.e1rm ? `Peak: ${b.weight} × ${b.reps} (${b.date.slice(5)})` : 'No logged sets'}
          </div>
          ${isExpanded
            ? `<div class="expanded-detail">${buildDualLayerExpandedSvg(pts, 'main')}</div>`
            : `<div class="mini-spark-wrap">${buildDualLayerSparklineSvg(pts, '#38bdf8', true)}</div>`
          }
        </div>
      `;
    }).join('') + `</div>`;

    const accessoryNames = Array.from(accessorySet);
    const accHtml = accessoryNames.length ? `
      <div class="sec-header">Accessories &amp; Circuits (Tap to Expand)</div>
      <div class="stat-grid">
        ${accessoryNames.map(name => {
          const st = accessoryStats[name];
          const pts = historyMap[name] || [];
          const isExpanded = expandedCardName === name;
          const safeName = name.replace(/'/g, "\\'");
          const hasLogs = st.totalReps > 0;

          let topHeadline = '—';
          let subLine = 'No logged sets';

          if (hasLogs) {
            if (st.isCircuit) {
              const distinctCount = Object.keys(st.moveStats).length;
              const circuitHit = st.totalGoalReps > 0 ? Math.min(100, Math.round((st.totalReps / st.totalGoalReps) * 100)) : 100;
              topHeadline = `${distinctCount} Move${distinctCount === 1 ? '' : 's'}`;
              subLine = `${circuitHit}% goal hit • ${st.totalReps} reps`;
            } else {
              topHeadline = st.bestWeight > 0 ? `${st.bestWeight} lb × ${st.bestReps}` : `${st.bestReps} reps`;
              const delta = (st.firstWeight !== null) ? +(st.latestWeight - st.firstWeight).toFixed(1) : 0;
              subLine = delta > 0
                ? `+${delta} lb since start`
                : (st.bestWeight > 0 ? `Baseline: ${st.bestWeight} lb` : `Logged ${st.totalReps} reps`);
            }
          }

          return `
            <div class="stat-box acc-box ${isExpanded ? 'expanded' : ''}" onclick="toggleExpandCard('${safeName}')">
